    <h1>📊 KD-Tree vs LSH</h1>

    <div class="comparison-container">

        <div class="algorithm-card">
            <h2>KD-Tree</h2>

            <p><strong>Accuracy:</strong> 92%</p>
            <p><strong>Runtime:</strong> 24 ms</p>
            <p><strong>Memory Usage:</strong> 175 MB</p>

            <p class="algorithm-description">
                Exact nearest-neighbor search.
            </p>
        </div>

        <div class="algorithm-card">
            <h2>LSH</h2>

            <p><strong>Accuracy:</strong> 88%</p>
            <p><strong>Runtime:</strong> 6 ms</p>
            <p><strong>Memory Usage:</strong> 120 MB</p>

            <p class="algorithm-description">
                Approximate nearest-neighbor search.
            </p>

        </div>

    </div>

    <div class="winner-card">
        <h2>🏆 Results Summary</h2>

        <p><strong>Most Accurate:</strong> KD-Tree</p>
        <p><strong>Fastest:</strong> LSH</p>
        <p><strong>Lowest Memory Usage:</strong> LSH</p>
    </div>
